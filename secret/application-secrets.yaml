---
# producer 전용 — MySQL
apiVersion: v1
kind: Secret
metadata:
  name: mysql-app-secrets
  namespace: semi-app
type: Opaque
stringData:
  # application.yaml 의 spring.datasource.*
  # mysql.semi-db = db/db-services.yaml 의 headless Service 이름 + 네임스페이스.
  #   이 앱은 semi-app 에 있고 DB 는 semi-db 에 있어서, 짧은 이름 "mysql" 은
  #   해석되지 않는다. 반드시 <service>.<namespace> 형태로 써야 한다.
  #   (정식 FQDN 은 mysql.semi-db.svc.cluster.local)
  # DB 이름/계정은 db-secrets.yaml 의 mysql-auth 값과 같아야 함
  DB_URL: "jdbc:mysql://mysql.semi-db:3306/sampledb?useSSL=false&allowPublicKeyRetrieval=true"
  DB_USERNAME: "sampleuser"
  DB_PASSWORD: "samplePassword"
---
# consumer 전용 — MongoDB
apiVersion: v1
kind: Secret
metadata:
  name: mongo-app-secrets
  namespace: semi-app
type: Opaque
stringData:
  # .env 의 MONGODB_*
  # mongodb-0.mongodb.semi-db = <pod>.<headless service>.<namespace>
  #   mongodb-0 은 특정 Pod 지정. semi-app 에서 semi-db 를 부르므로
  #   네임스페이스까지 붙여야 한다.
  MONGODB_URI: "mongodb://rootusername:rootPassword@mongodb-0.mongodb.semi-db:27017/samplemongo?authSource=admin"
  MONGODB_DATABASE: "samplemongo"
---
# consumer, producer 공용 — Kafka
apiVersion: v1
kind: Secret
metadata:
  name: kafka-app-secrets
  namespace: semi-app
type: Opaque
stringData:
  # kafka Service/Endpoints 를 semi-app 에 두었으므로 짧은 이름 그대로 통한다.
  # (kafka/kafka-external.yaml 참고 — 실체는 worker3 192.168.0.104 의 외부 브로커)
  #
  # 두 키가 모두 필요하다. 이미지마다 application.yaml 이 다르기 때문:
  #   producer: bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  #             -> 플레이스홀더를 직접 참조하므로 KAFKA_ 키가 필요
  #   consumer: bootstrap-servers: 127.0.0.1:9092   (하드코딩, 환경변수 참조 없음)
  #             -> 환경변수가 jar 안 application.yaml 보다 우선순위가 높으므로
  #                relaxed binding 이름(SPRING_KAFKA_BOOTSTRAP_SERVERS ->
  #                spring.kafka.bootstrap-servers)으로 값을 덮어써야 한다.
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"