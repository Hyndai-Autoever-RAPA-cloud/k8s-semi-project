---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv          # PV 는 클러스터 스코프라 namespace 를 넣지 않는다
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage
  nfs:
    server: 192.168.0.104
    path: /nfs/k8s
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc         # PVC 는 네임스페이스 스코프. mysql 이 마운트하므로 semi-db
  namespace: semi-db
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-storage