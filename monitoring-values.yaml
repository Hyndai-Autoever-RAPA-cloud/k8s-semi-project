# ============================================================
# kube-prometheus-stack 경량 구성
#
# 실행 노드:
#   worker1, worker2 → monitoring=true 라벨 필요
#
# 저장 방식:
#   Prometheus → 임시 로컬 저장소
#   Grafana    → 임시 로컬 저장소
#
# 수집 대상:
#   Kubernetes API Server
#   CoreDNS
#   Kubelet
#   cAdvisor
#   kube-state-metrics
#   node-exporter
# ============================================================


# ------------------------------------------------------------
# Alertmanager
# 현재는 알림 기능을 사용하지 않으므로 설치하지 않음
# ------------------------------------------------------------
alertmanager:
  enabled: false


# ------------------------------------------------------------
# 기본 Rule (Recording Rule + Alert Rule)
#
# 이름이 "Rule" 이라 알림 전용처럼 보이지만 실제로는 둘 다 만든다.
#   - Alert Rule     : 조건이 맞으면 Alertmanager 로 알림을 쏜다
#   - Recording Rule : 자주 쓰는 쿼리를 미리 계산해 새 메트릭으로 저장한다
#                      예) node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
#
# 처음엔 Alertmanager 를 안 쓰니 false 로 뒀는데, 그러면 Recording Rule 까지
# 같이 꺼진다. 기본 대시보드(CPU Quota 등)는 원본 메트릭이 아니라 이
# Recording Rule 이름을 조회하도록 만들어져 있어서, 수집은 정상인데
# 패널만 전부 "No data" 로 나왔다.
#   container_cpu_usage_seconds_total          -> 데이터 있음
#   node_namespace_pod_container:...:sum_irate -> 없음  (아무도 안 만듦)
#
# Alertmanager 가 없어도 Alert Rule 자체는 문제되지 않는다. Prometheus 가
# 평가만 하고 보낼 곳이 없어 그냥 firing 상태로 UI 에 남을 뿐이다.
# ------------------------------------------------------------
defaultRules:
  create: true


# ------------------------------------------------------------
# Prometheus
# ------------------------------------------------------------
prometheus:
  enabled: true

  # Grafana 와 같은 이유로 NodePort 로 연다. (grafana 섹션 주석 참고)
  # NodePort 허용 범위가 30000-32767 이라 9090 을 그대로 쓸 수 없어
  # 연상되는 30090 으로 잡았다.
  #
  #   접속: http://192.168.0.101:30090
  #
  # 참고로 Grafana 는 이 Prometheus 를 NodePort 가 아니라 클러스터 내부
  # DNS 로 바라본다. 즉 이 설정은 사람이 PromQL 을 직접 쳐보기 위한 것이고,
  # 대시보드 동작과는 무관하다.
  service:
    type: NodePort
    nodePort: 30090

  prometheusSpec:
    # worker1, worker2 중 한 곳에 배치
    nodeSelector:
      monitoring: "true"

    # 메트릭 보관 기간
    retention: 24h

    # 메트릭 저장량 제한
    retentionSize: "512MB"

    # 메트릭 수집 및 규칙 평가 주기
    scrapeInterval: 30s
    evaluationInterval: 30s

    # PVC를 설정하지 않음
    # Prometheus Pod의 임시 로컬 저장공간 사용

    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 1Gi


# ------------------------------------------------------------
# Grafana
# ------------------------------------------------------------
grafana:
  enabled: true

  # 기본값인 ClusterIP 는 kube-proxy 가 만드는 가상 IP 라서 노드의 NIC 에
  # 바인딩되지 않는다. ss 에도 안 잡히고 브라우저로도 못 붙는다.
  # port-forward 로도 되지만 터미널을 계속 띄워둬야 해서 NodePort 로 고정한다.
  #
  # nodePort 를 생략하면 30000-32767 중 임의로 배정되어 재설치할 때마다
  # 주소가 바뀐다. 명시해두면 항상 같은 포트로 접속할 수 있다.
  #
  #   접속: http://192.168.0.101:30030
  #   Pod 는 worker1/worker2 에 있지만 NodePort 는 모든 노드에 열리므로
  #   master IP 로 붙어도 kube-proxy 가 알아서 넘겨준다.
  service:
    type: NodePort
    nodePort: 30030

  # worker1, worker2 중 한 곳에 배치
  nodeSelector:
    monitoring: "true"

  # PVC를 사용하지 않음
  persistence:
    enabled: false

  # Grafana 자체 /metrics 수집은 사용하지 않음
  # Grafana 화면 사용 여부와는 무관함
  serviceMonitor:
    enabled: false

  # Grafana 13 은 부팅 시 플러그인 로딩 + 내장 apiserver 초기화로 CPU 를 많이 쓴다.
  # cpu 300m 에서는 스로틀링으로 3000 포트를 여는 데 160초 넘게 걸려
  # liveness(60s + 10s x 10회) 에 걸려 재시작이 반복됐다.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # 부팅이 느린 환경이라 liveness 첫 검사를 늦춘다. (나머지 probe 값은 차트 기본값 유지)
  livenessProbe:
    initialDelaySeconds: 300

  # 데이터소스가 "Plugin not registered" 로 죽는 문제를 막는다.
  #
  #   Grafana 는 부팅 때 번들 플러그인을 등록한 뒤(02:04:58 Plugin registered),
  #   곧바로 backgroundinstaller 가 최신판으로 갈아끼우려고 기존 디렉터리를
  #   지운다. 그런데 차트 기본 securityContext 가 readOnlyRootFilesystem: true 라
  #   /usr/share/grafana/data/plugins-bundled 를 못 지운다:
  #     "Failed to install plugin pluginId=prometheus
  #      error=unlinkat ...plugins-bundled/prometheus: read-only file system"
  #   이 실패로 이미 등록돼 있던 플러그인까지 레지스트리에서 빠져서
  #   prometheus/loki/mysql 등 13개가 전부 못 쓰는 상태가 된다.
  #
  #   readOnlyRootFilesystem 을 끄는 것보다 재설치 자체를 끄는 게 맞다.
  #   이미지에 들어있는 번들 플러그인으로 충분하고, 어차피 이 환경은
  #   외부 플러그인을 받아올 일이 없다.
  grafana.ini:
    plugins:
      preinstall_disabled: true


# ------------------------------------------------------------
# Prometheus Operator
# ServiceMonitor 등을 감시하고 Prometheus 설정을 자동 생성
# ------------------------------------------------------------
prometheusOperator:
  enabled: true

  # worker1, worker2 중 한 곳에 배치
  nodeSelector:
    monitoring: "true"

  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 256Mi


# ------------------------------------------------------------
# kube-state-metrics
# Deployment, Pod, StatefulSet, PVC 등의 상태 수집
# ------------------------------------------------------------
kube-state-metrics:
  enabled: true

  # worker1, worker2 중 한 곳에 배치
  nodeSelector:
    monitoring: "true"

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi


# ------------------------------------------------------------
# node-exporter
# 각 노드의 CPU, 메모리, 디스크, 네트워크 수집
#
# DaemonSet으로 실행되므로 각 노드에 하나씩 생성됨
# ------------------------------------------------------------
prometheus-node-exporter:
  enabled: true

  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi


# ------------------------------------------------------------
# Kubernetes API Server
# 현재 Target이 UP이므로 계속 수집
# ------------------------------------------------------------
kubeApiServer:
  enabled: true


# ------------------------------------------------------------
# Kubelet
#
# /metrics
# /metrics/cadvisor
# /metrics/probes
#
# 현재 Target이 UP이므로 계속 수집
# ------------------------------------------------------------
kubelet:
  enabled: true

  serviceMonitor:
    interval: 30s

    cAdvisor: true
    cAdvisorInterval: 30s

    probes: true
    probesInterval: 30s


# ------------------------------------------------------------
# CoreDNS
# 현재 Target이 UP이므로 계속 수집
# ------------------------------------------------------------
coreDns:
  enabled: true


# ------------------------------------------------------------
# kube-controller-manager
#
# kubeadm 기본 설정에서는 10257 포트가 localhost에만
# 바인딩되어 Prometheus가 접근하지 못하므로 비활성화
# ------------------------------------------------------------
kubeControllerManager:
  enabled: false


# ------------------------------------------------------------
# kube-scheduler
#
# kubeadm 기본 설정에서는 10259 포트가 localhost에만
# 바인딩되어 Prometheus가 접근하지 못하므로 비활성화
# ------------------------------------------------------------
kubeScheduler:
  enabled: false


# ------------------------------------------------------------
# etcd
#
# kubeadm 기본 설정에서는 2381 메트릭 포트가 localhost에만
# 바인딩되어 Prometheus가 접근하지 못하므로 비활성화
# ------------------------------------------------------------
kubeEtcd:
  enabled: false


# ------------------------------------------------------------
# kube-proxy
#
# 현재 각 노드의 10249 포트가 localhost에만 바인딩되어
# connection refused가 발생하므로 비활성화
# ------------------------------------------------------------
kubeProxy:
  enabled: false